<figure class="diagram">
    <figcaption>Diagram 2 &middot; the arrows of conflict</figcaption>
    <div class="diagram-svg-wrap">
      <svg viewBox="0 0 760 560" role="img" aria-label="Triangle of conflicts between the three modules: privacy against the treasury audit, the common floor against the right to fork, plurality of identity against a single quorum for updating">
        <defs>
          <marker id="ah31" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#9c742e" stroke-width="1.6"/></marker>
        </defs>
        <line class="svg-edge" x1="304" y1="150" x2="212" y2="372" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <line class="svg-edge" x1="456" y1="150" x2="548" y2="372" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <line class="svg-edge" x1="300" y1="430" x2="460" y2="430" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <text class="svg-center" x="380" y="300" text-anchor="middle">the same dials:</text>
        <text class="svg-center" x="380" y="320" text-anchor="middle">freedom &middot; safety &middot; welfare</text>
        <text class="svg-center" x="380" y="340" text-anchor="middle">trust &middot; peace</text>
        <g><rect class="svg-node" x="270" y="58" width="220" height="92" rx="3"/><text class="svg-node-k" x="380" y="90" text-anchor="middle">Module 1</text><text class="svg-node-t" x="380" y="118" text-anchor="middle">Identity</text></g>
        <g><rect class="svg-node" x="60" y="384" width="220" height="92" rx="3"/><text class="svg-node-k" x="170" y="416" text-anchor="middle">Module 2</text><text class="svg-node-t" x="170" y="444" text-anchor="middle">Economy</text></g>
        <g><rect class="svg-node" x="480" y="384" width="220" height="92" rx="3"/><text class="svg-node-k" x="590" y="416" text-anchor="middle">Module 3</text><text class="svg-node-t" x="590" y="444" text-anchor="middle">Updating</text></g>
        <g><rect class="svg-lbl-bg" x="150" y="248" width="196" height="20"/><text class="svg-lbl" x="248" y="262" text-anchor="middle">privacy / treasury audit</text></g>
        <g><rect class="svg-lbl-bg" x="410" y="248" width="212" height="20"/><text class="svg-lbl" x="516" y="262" text-anchor="middle">ID plurality / single quorum</text></g>
        <g><rect class="svg-lbl-bg" x="266" y="420" width="228" height="20"/><text class="svg-lbl" x="380" y="434" text-anchor="middle">common floor / right to fork</text></g>
      </svg>
    </div>
    <div class="conflict-legend">
      <div class="cl"><b>Privacy (M1) against accountability of the treasury (M2).</b><span>The stronger the zero-knowledge anonymity, the harder it is to audit who spends the kernel's purse and how. The privacy of the citizen and the transparency of power are in partial contradiction, since power is made of citizens.</span></div>
      <div class="cl"><b>Easy forking (M3) against the common floor (M2).</b><span>The freer exit and separation are, the weaker the no-exit base that only compulsion holds together. Wealthy Cells will fork away from their obligations to the poor - and that is a return to sorting people by usefulness.</span></div>
      <div class="cl"><b>Plurality of issuers (M1) against unity of the update rules (M3).</b><span>Many sources of identity are good against capture, but who counts as "everyone" when the kernel is changed, if "everyone" is certified by different issuers who do not agree?</span></div>
    </div>
  </figure>
