<figure class="diagram">
      <figcaption>Diagram 1 &middot; three layers</figcaption>
      <div class="stack">
        <div class="layer">
          <span class="l-chip chip-lock">common, no exit</span>
          <div class="l-eyebrow">Layer 3 &middot; planetary</div>
          <div class="l-title">What is common to all</div>
          <p class="l-desc">Climate, oceans, atmosphere, orbit, pandemics, governance of the supertechnologies. The only layer that needs genuine global coordination: neither exit nor borders work here physically - there is one atmosphere for everyone.</p>
        </div>
        <div class="layer">
          <span class="l-chip chip-exit">voluntary, exit is free</span>
          <div class="l-eyebrow">Layer 2 &middot; functional</div>
          <div class="l-title">Voluntary belongings</div>
          <p class="l-desc">Everything that can be untied from geography: professional, cultural, value-based and economic communities. Multiple belonging is the norm, not a betrayal. A person is in ten of them, not one.</p>
        </div>
        <div class="layer kernel">
          <span class="l-chip">microkernel &middot; ring 0</span>
          <div class="l-eyebrow">Layer 1 &middot; territorial</div>
          <div class="l-title">A thin coercive foundation</div>
          <p class="l-desc">Physical space, safety, infrastructure, ecology. It stays coercive and tied to a place, but becomes far thinner - it ceases to own a person's identity and meaning. An operator that serves a territory, not a fatherland.</p>
        </div>
      </div>
      <div class="subsidiarity">
        <svg width="16" height="34" viewBox="0 0 16 34" aria-hidden="true"><path d="M8 33 V6" stroke="#9c742e" stroke-width="1.6" fill="none"/><path d="M8 2 L3 10 L13 10 Z" fill="#9c742e"/></svg>
        <span>subsidiarity: a task rises higher only when the level below cannot hold it</span>
      </div>
    </figure>
