<figure class="diagram">
      <figcaption>Schéma 1 &middot; trois couches</figcaption>
      <div class="stack">
        <div class="layer">
          <span class="l-chip chip-lock">commun, sans sortie</span>
          <div class="l-eyebrow">Couche 3 &middot; planétaire</div>
          <div class="l-title">Le commun de tous</div>
          <p class="l-desc">Climat, océans, atmosphère, orbite, pandémies, gestion des super-technologies. La seule couche qui ait besoin d'une véritable coordination mondiale: ni la sortie ni les frontières n'y jouent physiquement - l'atmosphère est la même pour tous.</p>
        </div>
        <div class="layer">
          <span class="l-chip chip-exit">volontaire, sortie libre</span>
          <div class="l-eyebrow">Couche 2 &middot; fonctionnelle</div>
          <div class="l-title">Les appartenances volontaires</div>
          <p class="l-desc">Tout ce que l'on peut détacher de la géographie: communautés professionnelles, culturelles, de valeurs, économiques. L'appartenance multiple est la règle et non une trahison. Une personne n'est pas dans une seule, mais dans une dizaine.</p>
        </div>
        <div class="layer kernel">
          <span class="l-chip">microkernel &middot; ring 0</span>
          <div class="l-eyebrow">Couche 1 &middot; territoriale</div>
          <div class="l-title">Un socle contraignant et mince</div>
          <p class="l-desc">Espace physique, sécurité, infrastructures, environnement. Il demeure contraignant et attaché au lieu, mais devient bien plus mince - il cesse d'être le maître de l'identité et du sens d'une personne. Un exploitant au service du territoire, et non une patrie.</p>
        </div>
      </div>
