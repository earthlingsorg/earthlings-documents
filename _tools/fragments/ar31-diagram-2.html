    <div class="conflict-legend">
      <div class="cl"><b>الخصوصية (M1) في مقابل مساءلة الخزانة (M2).</b><span>كلما اشتدت السرية بتقنية ZK، صعب تدقيق من ينفق أموال النواة وكيف ينفقها. فخصوصية المواطن وشفافية السلطة في تناقض جزئي، ما دامت السلطة تتألف من المواطنين.</span></div>
      <div class="cl"><b>التفريع السهل (M3) في مقابل الأرضية المشتركة (M2).</b><span>كلما زادت حرية الخروج والانفصال، ضعفت القاعدة التي لا يُخرَج منها والتي لا يمسكها إلا الإكراه. فالخلايا الغنية ستُفرّع نفسها بعيداً عن التزاماتها تجاه الفقراء - وهذا عودة إلى الفرز بحسب المنفعة.</span></div>
      <div class="cl"><b>تعدد جهات الإصدار (M1) في مقابل وحدة قواعد التحديث (M3).</b><span>تعدد مصادر الشخصية أمر جيد ضد الاستيلاء، لكن من يُعدّ «الجميع» عند تغيير النواة، إذا كان «الجميع» تصدّق عليهم جهات إصدار مختلفة غير متفقة؟</span></div>
