<figure class="diagram">
    <figcaption>Esquema 2 &middot; las flechas de los conflictos</figcaption>
    <div class="diagram-svg-wrap">
      <svg viewBox="0 0 760 560" role="img" aria-label="El triángulo de conflictos de los tres módulos: la privacidad contra la auditoría de la caja, el suelo común contra el derecho a bifurcarse, el pluralismo de la identidad contra un quórum único de actualización">
        <defs>
          <marker id="ah31" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#9c742e" stroke-width="1.6"/></marker>

        <line class="svg-edge" x1="304" y1="150" x2="212" y2="372" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <line class="svg-edge" x1="456" y1="150" x2="548" y2="372" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <line class="svg-edge" x1="300" y1="430" x2="460" y2="430" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <text class="svg-center" x="380" y="300" text-anchor="middle">los mismos mandos:</text>
        <text class="svg-center" x="380" y="320" text-anchor="middle">libertad &middot; seguridad &middot; bienestar</text>
        <text class="svg-center" x="380" y="340" text-anchor="middle">confianza &middot; paz</text>
        <g><rect class="svg-node" x="270" y="58" width="220" height="92" rx="3"/><text class="svg-node-k" x="380" y="90" text-anchor="middle">Módulo 1</text><text class="svg-node-t" x="380" y="118" text-anchor="middle">Identidad</text></g>
        <g><rect class="svg-node" x="60" y="384" width="220" height="92" rx="3"/><text class="svg-node-k" x="170" y="416" text-anchor="middle">Módulo 2</text><text class="svg-node-t" x="170" y="444" text-anchor="middle">Economía</text></g>
        <g><rect class="svg-node" x="480" y="384" width="220" height="92" rx="3"/><text class="svg-node-k" x="590" y="416" text-anchor="middle">Módulo 3</text><text class="svg-node-t" x="590" y="444" text-anchor="middle">Actualización</text></g>

      </svg>
    </div>
    <div class="conflict-legend">
      <div class="cl"><b>La privacidad (M1) contra la rendición de cuentas de la caja (M2).</b><span>Cuanto más fuerte es el anonimato ZK, más difícil es auditar quién gasta la caja del kernel y cómo. La privacidad del ciudadano y la transparencia del poder están en contradicción parcial, porque el poder está hecho de ciudadanos.</span></div>
      <div class="cl"><b>Una bifurcación fácil (M3) contra un suelo común (M2).</b><span>Cuanto más libres son la salida y la separación, más débil es la base sin salida, que solo sostiene la coacción. Las células ricas se bifurcarán lejos de sus obligaciones con los pobres, y eso es volver a la clasificación por utilidad.</span></div>
      <div class="cl"><b>El pluralismo de emisores (M1) contra la unidad de las reglas de actualización (M3).</b><span>Una multitud de fuentes de identidad está bien contra la captura, pero ¿quién cuenta como «todos» al cambiar el kernel, si a «todos» los acreditan emisores distintos y en desacuerdo?</span></div>
    </div>
  </figure>
