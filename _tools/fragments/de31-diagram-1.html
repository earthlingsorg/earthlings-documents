      <figcaption>Schema 1 &middot; drei Schichten</figcaption>
      <div class="stack">

          <div class="l-eyebrow">Schicht 3 &middot; planetar</div>
          <div class="l-title">Das Gemeinsame für alle</div>
          <p class="l-desc">Klima, Ozeane, Atmosphäre, Umlaufbahn, Pandemien, die Steuerung der Übertechniken. Die einzige Schicht, die eine wirkliche weltweite Abstimmung braucht: Weder Austritt noch Grenzen wirken hier physisch - die Atmosphäre ist für alle eine.</p>

          <p class="l-desc">Alles, was sich von der Geographie lösen lässt: berufliche, kulturelle, wertgebundene, wirtschaftliche Gemeinschaften. Mehrfache Zugehörigkeit ist die Regel und kein Verrat. Ein Mensch gehört nicht einer an, sondern einem Dutzend.</p>
        </div>
        <div class="layer kernel">
          <span class="l-chip">Mikrokern &middot; ring 0</span>

          <p class="l-desc">Physischer Raum, Sicherheit, Infrastruktur, Umwelt. Bleibt zwingend und an den Ort gebunden, wird aber viel dünner - es hört auf, der Herr über Identität und Sinn des Menschen zu sein. Ein dienender Betreiber des Gebiets und kein Vaterland.</p>
        </div>
