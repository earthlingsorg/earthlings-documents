    <div class="conflict-legend">
      <div class="cl"><b>एकांतता (M1) बनाम कोष की जवाबदेही (M2)।</b><span>ZK-अनामिकता जितनी मज़बूत होगी, यह जाँचना उतना ही कठिन होगा कि केंद्रक का धन कौन और कैसे खर्च करता है। नागरिक की एकांतता और सत्ता की पारदर्शिता आंशिक रूप से एक-दूसरे के विरुद्ध हैं, क्योंकि सत्ता नागरिकों से ही बनी है।</span></div>
      <div class="cl"><b>आसान फोर्क (M3) बनाम साझा फ़र्श (M2)।</b><span>निकास और अलगाव जितने स्वतंत्र होंगे, वह अनिवार्य आधार उतना ही कमज़ोर होगा जिसे केवल बाध्यता थामे रखती है। समृद्ध कोशिकाएँ निर्धनों के प्रति दायित्वों से फोर्क कर जाएँगी - और यह उपयोगिता के अनुसार छँटाई की वापसी है।</span></div>
      <div class="cl"><b>निर्गमकर्ताओं की बहुलता (M1) बनाम नवीकरण के नियमों की एकता (M3)।</b><span>पहचान के अनेक स्रोत अधिग्रहण के विरुद्ध अच्छे हैं, पर केंद्रक बदलते समय «सब» कौन गिने जाएँगे, यदि «सबको» भिन्न और असहमत निर्गमकर्ता प्रमाणित करते हों?</span></div>
