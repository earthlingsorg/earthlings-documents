      <div class="stack">

          <p class="l-desc">वह सब जिसे भूगोल से अलग किया जा सकता है: व्यावसायिक, सांस्कृतिक, मूल्य-आधारित, आर्थिक समुदाय। एक साथ कई संबद्धताएँ नियम हैं, विश्वासघात नहीं। व्यक्ति एक में नहीं, दस में होता है।</p>

          <p class="l-desc">भौतिक स्थान, सुरक्षा, अवसंरचना, पारिस्थितिकी। यह बाध्यकारी और स्थान से बँधा रहता है, पर बहुत पतला हो जाता है - व्यक्ति की पहचान और अर्थ का स्वामी नहीं रह जाता। क्षेत्र का सेवा-प्रदाता, पितृभूमि नहीं।</p>
