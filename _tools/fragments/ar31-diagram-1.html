<figure class="diagram">
      <figcaption>المخطط 1 &middot; ثلاث طبقات</figcaption>
      <div class="stack">
        <div class="layer">
          <span class="l-chip chip-lock">مشترَك، لا يُخرَج منه</span>
          <div class="l-eyebrow">الطبقة 3 &middot; الكوكبية</div>
          <div class="l-title">المشترَك للجميع</div>
          <p class="l-desc">المناخ، والمحيطات، والغلاف الجوي، والمدار، والجوائح، وإدارة التقنيات الفائقة. الطبقة الوحيدة التي تحتاج إلى تنسيق عالمي حقيقي: فلا الخروج ولا الحدود يعملان هنا مادياً - والغلاف الجوي واحد للجميع.</p>
        </div>
        <div class="layer">
          <span class="l-chip chip-exit">طوعي، والخروج حرّ</span>
          <div class="l-eyebrow">الطبقة 2 &middot; الوظيفية</div>
          <div class="l-title">انتماءات طوعية</div>
          <p class="l-desc">كل ما يمكن فكّه عن الجغرافيا: جماعات مهنية وثقافية وقيمية واقتصادية. وتعدد الانتماء قاعدة لا خيانة. والإنسان لا ينتمي إلى واحدة، بل إلى عشر.</p>
        </div>
        <div class="layer kernel">
          <span class="l-chip">نواة مصغّرة &middot; ring 0</span>
          <div class="l-eyebrow">الطبقة 1 &middot; الإقليمية</div>
          <div class="l-title">أساس إكراهي رقيق</div>
          <p class="l-desc">المجال المادي، والأمن، والبنية التحتية، والبيئة. يبقى إكراهياً ومربوطاً بالمكان، لكنه يصير أرقّ بكثير - ويكفّ عن أن يكون مالك هوية الإنسان ومعناه. مشغّل خدمي للإقليم، لا وطن-أب.</p>
        </div>
