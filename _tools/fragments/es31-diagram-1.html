<figure class="diagram">
      <figcaption>Esquema 1 &middot; tres capas</figcaption>
      <div class="stack">
        <div class="layer">
          <span class="l-chip chip-lock">lo común, sin salida</span>
          <div class="l-eyebrow">Capa 3 &middot; planetaria</div>
          <div class="l-title">Lo común de todos</div>
          <p class="l-desc">Clima, océanos, atmósfera, órbita, pandemias, gestión de las supertecnologías. La única capa que necesita una coordinación mundial de verdad: ni la salida ni las fronteras operan aquí físicamente; la atmósfera es la misma para todos.</p>
        </div>
        <div class="layer">
          <span class="l-chip chip-exit">voluntaria, salida libre</span>
          <div class="l-eyebrow">Capa 2 &middot; funcional</div>
          <div class="l-title">Las pertenencias voluntarias</div>
          <p class="l-desc">Todo lo que se puede desligar de la geografía: comunidades profesionales, culturales, de valores, económicas. La pertenencia múltiple es la regla y no una traición. Una persona no está en una sola, sino en una decena.</p>
        </div>
        <div class="layer kernel">
          <span class="l-chip">microkernel &middot; ring 0</span>
          <div class="l-eyebrow">Capa 1 &middot; territorial</div>
          <div class="l-title">Un cimiento coactivo y delgado</div>
          <p class="l-desc">Espacio físico, seguridad, infraestructuras, medio ambiente. Sigue siendo coactivo y atado al lugar, pero se vuelve mucho más delgado: deja de ser el dueño de la identidad y del sentido de una persona. Un operador al servicio del territorio, y no una patria.</p>
        </div>
      </div>
      <div class="subsidiarity">
        <svg width="16" height="34" viewBox="0 0 16 34" aria-hidden="true"><path d="M8 33 V6" stroke="#9c742e" stroke-width="1.6" fill="none"/><path d="M8 2 L3 10 L13 10 Z" fill="#9c742e"/></svg>
        <span>subsidiariedad: una tarea sube solo cuando no puede sostenerse abajo</span>
      </div>
    </figure>
