<figure class="diagram">
    <figcaption>Schema 2 &middot; die Pfeile der Konflikte</figcaption>
    <div class="diagram-svg-wrap">
      <svg viewBox="0 0 760 560" role="img" aria-label="Das Konfliktdreieck der drei Module: Privatheit gegen die Prüfung der Kasse, ein gemeinsamer Floor gegen das Recht auf Fork, der Pluralismus der Identität gegen ein einheitliches Quorum der Aktualisierung">
        <defs>
          <marker id="ah31" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#9c742e" stroke-width="1.6"/></marker>
        </defs>
        <line class="svg-edge" x1="304" y1="150" x2="212" y2="372" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <line class="svg-edge" x1="456" y1="150" x2="548" y2="372" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <line class="svg-edge" x1="300" y1="430" x2="460" y2="430" marker-start="url(#ah31)" marker-end="url(#ah31)"/>
        <text class="svg-center" x="380" y="300" text-anchor="middle">dieselben Regler:</text>
        <text class="svg-center" x="380" y="320" text-anchor="middle">Freiheit &middot; Sicherheit &middot; Wohlergehen</text>
        <text class="svg-center" x="380" y="340" text-anchor="middle">Vertrauen &middot; Frieden</text>
        <g><rect class="svg-node" x="270" y="58" width="220" height="92" rx="3"/><text class="svg-node-k" x="380" y="90" text-anchor="middle">Modul 1</text><text class="svg-node-t" x="380" y="118" text-anchor="middle">Identität</text></g>
        <g><rect class="svg-node" x="60" y="384" width="220" height="92" rx="3"/><text class="svg-node-k" x="170" y="416" text-anchor="middle">Modul 2</text><text class="svg-node-t" x="170" y="444" text-anchor="middle">Wirtschaft</text></g>
        <g><rect class="svg-node" x="480" y="384" width="220" height="92" rx="3"/><text class="svg-node-k" x="590" y="416" text-anchor="middle">Modul 3</text><text class="svg-node-t" x="590" y="444" text-anchor="middle">Aktualisierung</text></g>
        <g><rect class="svg-lbl-bg" x="130" y="248" width="236" height="20"/><text class="svg-lbl" x="248" y="262" text-anchor="middle">Privatheit / Prüfung der Kasse</text></g>
        <g><rect class="svg-lbl-bg" x="410" y="248" width="212" height="20"/><text class="svg-lbl" x="516" y="262" text-anchor="middle">ID-Pluralismus / ein Quorum</text></g>
        <g><rect class="svg-lbl-bg" x="286" y="420" width="188" height="20"/><text class="svg-lbl" x="380" y="434" text-anchor="middle">Floor / Recht auf Fork</text></g>
      </svg>
    </div>
    <div class="conflict-legend">
      <div class="cl"><b>Privatheit (M1) gegen die Rechenschaft der Kasse (M2).</b><span>Je stärker die ZK-Anonymität, desto schwerer lässt sich prüfen, wer die Kasse des Kerns wie ausgibt. Die Privatheit des Bürgers und die Durchsichtigkeit der Macht stehen im Teilwiderspruch, denn die Macht besteht aus Bürgern.</span></div>
      <div class="cl"><b>Ein leichter Fork (M3) gegen einen gemeinsamen Floor (M2).</b><span>Je freier Austritt und Abtrennung, desto schwächer die Grundlage ohne Austritt, die allein der Zwang hält. Reiche Zellen forken sich von den Pflichten gegenüber den Armen weg - und das ist die Rückkehr zur Sortierung nach Nützlichkeit.</span></div>
      <div class="cl"><b>Die Vielfalt der Aussteller (M1) gegen die Einheit der Regeln der Aktualisierung (M3).</b><span>Viele Quellen der Identität sind gut gegen die Übernahme, doch wer gilt bei einer Änderung des Kerns als „alle“, wenn „alle“ von verschiedenen, uneinigen Ausstellern bescheinigt werden?</span></div>
    </div>
  </figure>
